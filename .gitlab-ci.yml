# SPDX-License-Identifier: AGPL-3.0-or-later
image: oven/bun:1.4.2

include:
  - project: quip.network/ci-templates
    ref: v1.1.1
    file: templates/dependency-gate.yml

# No other job runs on a stable tag. GitLab creates no pipeline when only .pre and
# .post jobs match, so the gate runs in the test stage instead.
dependency-gate:
  stage: test

stages:
  - test

test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  script:
    - bun install --frozen-lockfile
    - bunx playwright install --with-deps chromium
    - bun run format:check
    - bun run lint
    - bun run typecheck
    - bun run test
